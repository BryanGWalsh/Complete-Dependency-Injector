name: complete_dependency_injector_flutter
description: Flutter extensions for complete_dependency_injector, including a lightweight, non-opinionated state management solution.
version: 2.1.0
repository: https://github.com/BryanGWalsh/Complete-Dependency-Injector
homepage: https://complete-dependency-injector.bryangwalsh.com
documentation: https://complete-dependency-injector.bryangwalsh.com

environment:
  sdk: ^3.8.1
  flutter: ">=3.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  complete_dependency_injector: ^2.1.0
     #path: ../complete_dependency_injector
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

